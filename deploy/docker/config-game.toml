bind_addr = ":50053"
log_level = "DEBUG"
tick_rate = "50ms"
# Полный список тайлов в state раз в интервал; между ними — дельта tile_updates. Env: TILE_FULL_SYNC_INTERVAL.
tile_full_sync_interval = "5s"
# Шаг по интенту move не чаще чем раз в N тиков симуляции (1 = каждый тик; 2 ≈ вдвое медленнее ходьба при том же TPS и частоте state).
movement_apply_every_n_ticks = 2
queue_size = 1024
jwt_secret = "123"
# id мира в world-service (лобби). Пусто = старт с пустого мира. Env WORLD_ID перекрывает это значение.
world_id = ""
# gRPC world-service. Локально: localhost:50054. В compose по умолчанию world-service:50054.
world_service_addr = "localhost:50054"
# Если в world-service задан service_token; можно задать через WORLD_SERVICE_TOKEN.
world_service_token = ""
# Только этот user_id (из JWT при подключении к WS) может отправлять type "save_world". Env: SAVE_WORLD_ADMIN_USER_ID.
save_world_admin_user_id = 1
# character-service gRPC (пусто — без character_id на WS). Локально: localhost:50055. В compose: character-service:50055.
character_service_addr = ""
character_service_token = ""
# Каталог предметов и сценарии interact (pkg/gamekit/content). Пусто — без interact.
content_catalog_path = "/app/data/content/catalog.json"
content_scripts_dir = "/app/data/content/scripts"
