bind_addr = ":50054"
# Как auth/chat: через опубликованный порт на хосте — обходит обрывы bridge/iptables до postgres:5432.
database_url = "postgres://messenger:messenger@host.docker.internal:15432/world_db?sslmode=disable"
log_level = "DEBUG"
# Пусто = без проверки (только приватная сеть). Для прод задайте секрет.
service_token = ""
