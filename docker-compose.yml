services:
  postgres:
    image: postgres:16-alpine
    container_name: grpc-auth-postgres
    environment:
      POSTGRES_USER: messenger
      POSTGRES_PASSWORD: messenger
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      # Host port avoids conflict with local Postgres; used by app containers through host.docker.internal.
      - "${POSTGRES_HOST_PORT:-15432}:5432"
    healthcheck:
      # Use TCP to localhost so "ready" matches what other containers need over the network.
      test: ["CMD-SHELL", "pg_isready -U messenger -d postgres -h 127.0.0.1 -p 5432"]
      interval: 5s
      timeout: 5s
      retries: 10

  # initdb.d only runs on empty volumes; existing data skips it, so ensure app DBs exist.
  postgres-init-dbs:
    image: postgres:16-alpine
    network_mode: "service:postgres"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: messenger
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -h 127.0.0.1 -U messenger -d postgres -Atqc "SELECT 1 FROM pg_database WHERE datname='auth_db'" | grep -q 1 || psql -h 127.0.0.1 -U messenger -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE auth_db OWNER messenger"
        psql -h 127.0.0.1 -U messenger -d postgres -Atqc "SELECT 1 FROM pg_database WHERE datname='chat_db'" | grep -q 1 || psql -h 127.0.0.1 -U messenger -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE chat_db OWNER messenger"
        psql -h 127.0.0.1 -U messenger -d postgres -Atqc "SELECT 1 FROM pg_database WHERE datname='world_db'" | grep -q 1 || psql -h 127.0.0.1 -U messenger -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE world_db OWNER messenger"
        psql -h 127.0.0.1 -U messenger -d postgres -Atqc "SELECT 1 FROM pg_database WHERE datname='character_db'" | grep -q 1 || psql -h 127.0.0.1 -U messenger -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE character_db OWNER messenger"
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: grpc-auth-redis
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_HOST_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.19.0
    # Share postgres network stack so DB is reachable on 127.0.0.1. Avoids bridge/iptables
    # drops that still allow in-container pg_isready over the socket.
    network_mode: "service:postgres"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init-dbs:
        condition: service_completed_successfully
    volumes:
      - ./auth-service/migrations:/migrations/auth:ro
    command:
      [
        "-path", "/migrations/auth",
        "-database", "postgres://messenger:messenger@127.0.0.1:5432/auth_db?sslmode=disable",
        "up"
      ]
    restart: "no"

  migrate-chat:
    image: migrate/migrate:v4.19.0
    network_mode: "service:postgres"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init-dbs:
        condition: service_completed_successfully
    volumes:
      - ./chat-service/migrations:/migrations/chat:ro
    command:
      [
        "-path", "/migrations/chat",
        "-database", "postgres://messenger:messenger@127.0.0.1:5432/chat_db?sslmode=disable",
        "up"
      ]
    restart: "no"

  migrate-world:
    image: migrate/migrate:v4.19.0
    network_mode: "service:postgres"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init-dbs:
        condition: service_completed_successfully
    volumes:
      - ./world-service/migrations:/migrations/world:ro
    command:
      [
        "-path", "/migrations/world",
        "-database", "postgres://messenger:messenger@127.0.0.1:5432/world_db?sslmode=disable",
        "up"
      ]
    restart: "no"

  migrate-character:
    image: migrate/migrate:v4.19.0
    network_mode: "service:postgres"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init-dbs:
        condition: service_completed_successfully
    volumes:
      - ./character-service/migrations:/migrations/character:ro
    command:
      [
        "-path", "/migrations/character",
        "-database", "postgres://messenger:messenger@127.0.0.1:5432/character_db?sslmode=disable",
        "up"
      ]
    restart: "no"

  auth-service:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: grpc-auth-service
    command: ["-config-path", "/configs/config-auth.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50051 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 10s
    volumes:
      - ./deploy/docker/config-auth.toml:/configs/config-auth.toml:ro
    ports:
      - "50051:50051"

  chat-service:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: chat-service/Dockerfile
    container_name: grpc-chat-service
    command: ["-config-path", "/configs/config-chat.toml"]
    depends_on:
      auth-service:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate-chat:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50052 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 10s
    volumes:
      - ./deploy/docker/config-chat.toml:/configs/config-chat.toml:ro
    ports:
      - "50052:50052"

  gateway:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: grpc-gateway
    command: ["-config-path", "/configs/config-gateway.toml"]
    depends_on:
      auth-service:
        condition: service_healthy
      chat-service:
        condition: service_healthy
      game-service:
        condition: service_healthy
      character-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 10s
    volumes:
      - ./deploy/docker/config-gateway.toml:/configs/config-gateway.toml:ro
    ports:
      - "8080:8080"

  game-service:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: game-service/Dockerfile
    container_name: grpc-game-service
    env_file:
      - path: .env
        required: false
    environment:
      # Optional world id to preload on startup; empty starts from an in-memory blank world.
      WORLD_ID: ${WORLD_ID:-}
      WORLD_SERVICE_ADDR: ${WORLD_SERVICE_ADDR:-host.docker.internal:50054}
      CHARACTER_SERVICE_ADDR: ${CHARACTER_SERVICE_ADDR:-host.docker.internal:50055}
    command: ["-config-path", "/configs/config-game.toml"]
    depends_on:
      world-service:
        condition: service_healthy
      character-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50053 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 15s
    volumes:
      - ./deploy/docker/config-game.toml:/configs/config-game.toml:ro
      - ./game-service/data:/app/data:ro
    ports:
      - "50053:50053"

  world-service:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./world-service
      dockerfile: Dockerfile
    container_name: grpc-world-service
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50054 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 20s
    command: ["-config-path", "/configs/config-world.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate-world:
        condition: service_completed_successfully
    volumes:
      - ./deploy/docker/config-world.toml:/configs/config-world.toml:ro
    ports:
      - "50054:50054"

  character-service:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: ./character-service
      dockerfile: Dockerfile
    container_name: grpc-character-service
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 50055 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 25
      start_period: 25s
    command: ["-config-path", "/configs/config-character.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate-character:
        condition: service_completed_successfully
    volumes:
      - ./deploy/docker/config-character.toml:/configs/config-character.toml:ro
    ports:
      - "50055:50055"

volumes:
  postgres-data:
  redis-data:
