syntax = "proto3";

package chat.v1;

import "google/protobuf/timestamp.proto";

option go_package = "chat/proto/chat/v1;chatv1";

service ChatService {
  // DM: создать или получить существующий чат между двумя пользователями
  rpc GetOrCreateChat(GetOrCreateChatRequest) returns (GetOrCreateChatResponse);

  // Групповой/любой чат: создать пустой чат, участники добавляются отдельно
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);

  // Удалить чат вместе со всеми сообщениями и участниками
  rpc DeleteChat(DeleteChatRequest) returns (DeleteChatResponse);

  // Участники
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  // Сообщения
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetMessages(GetMessagesRequest) returns (GetMessagesResponse);

  // Список чатов пользователя
  rpc GetUserChats(GetUserChatsRequest) returns (GetUserChatsResponse);

  // Subscribe открывает стрим — сервер пушит новые сообщения
  // из всех чатов авторизованного пользователя.
  rpc Subscribe(SubscribeRequest) returns (stream MessageDTO);
}

// --- CreateChat ---

message CreateChatRequest {
  string name = 1; // опционально, для групповых чатов
}

message CreateChatResponse {
  int64                     chat_id    = 1;
  google.protobuf.Timestamp created_at = 2;
}

// --- DeleteChat ---

message DeleteChatRequest {
  int64 chat_id = 1;
}

message DeleteChatResponse {}

// --- AddMember ---

message AddMemberRequest {
  int64 chat_id = 1;
  int64 user_id = 2;
}

message AddMemberResponse {}

// --- RemoveMember ---

message RemoveMemberRequest {
  int64 chat_id = 1;
  int64 user_id = 2;
}

message RemoveMemberResponse {}

// --- GetOrCreateChat (DM) ---

message GetOrCreateChatRequest {
  int64 initiator_id = 1;
  int64 recipient_id = 2;
}

message GetOrCreateChatResponse {
  int64                     chat_id    = 1;
  bool                      created    = 2;
  google.protobuf.Timestamp created_at = 3;
}

// --- GetMessages ---

message GetMessagesRequest {
  int64  chat_id = 1;
  int64  limit   = 2;
  string cursor  = 3;
}

message GetMessagesResponse {
  repeated MessageDTO messages    = 1;
  string              next_cursor = 2;
}

// --- GetUserChats ---

message GetUserChatsRequest {
  int64 user_id = 1;
  int64 limit   = 2;
  int64 offset  = 3;
}

message GetUserChatsResponse {
  repeated ChatPreviewDTO chats = 1;
}

// --- SendMessage ---

message SendMessageRequest {
  int64  chat_id   = 1;
  int64  sender_id = 2;
  string text      = 3;
}

message SendMessageResponse {
  int64                     message_id = 1;
  google.protobuf.Timestamp created_at = 2;
}

// --- Subscribe ---

message SubscribeRequest {}

// --- DTOs ---

message MessageDTO {
  int64                     id         = 1;
  int64                     chat_id    = 2;
  int64                     sender_id  = 3;
  string                    text       = 4;
  google.protobuf.Timestamp created_at = 5;
}

message ChatPreviewDTO {
  int64                     chat_id         = 1;
  string                    name            = 2; // для DM — email/имя собеседника, для группы — name чата
  int64                     companion_id    = 3; // только для DM, иначе 0
  string                    last_message    = 4;
  int64                     unread_count    = 5;
  google.protobuf.Timestamp last_message_at = 6;
}
